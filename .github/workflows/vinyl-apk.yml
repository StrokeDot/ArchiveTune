name: Build ArchiveTune Vinyl APK

on:
  push:
    branches: [personal/vinyl]
    paths-ignore:
      - 'AGENTS.md'
      - 'worklog.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: archivetune-vinyl-apk
  cancel-in-progress: true

jobs:
  arm64:
    if: github.repository == 'StrokeDot/ArchiveTune' && github.ref == 'refs/heads/personal/vinyl'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build ARM64 release
        env:
          PULL_REQUEST: 'false'
          START_IO_APP_ID: ''
        run: bash gradlew --no-daemon :app:assembleGmsMobileArm64Release
      - name: Prepare unsigned APK
        run: |
          set -euo pipefail
          mapfile -t apks < <(find app/build/outputs/apk -type f -name '*-unsigned.apk')
          if (( ${#apks[@]} != 1 )); then
            echo 'Expected one unsigned ARM64 APK.' >&2
            printf '%s\n' "${apks[@]}" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/vinyl-apk"
          cp "${apks[0]}" "$RUNNER_TEMP/vinyl-apk/app-gms-mobile-arm64-release-unsigned.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: archivetune-vinyl-arm64-unsigned
          path: ${{ runner.temp }}/vinyl-apk/app-gms-mobile-arm64-release-unsigned.apk
          if-no-files-found: error
