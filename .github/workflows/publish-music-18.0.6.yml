name: Publish signed Music 18.0.6

on:
  push:
    branches: [release/music-18.0.6]

permissions:
  actions: read
  contents: write

concurrency:
  group: music-release-18.0.6
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'StrokeDot/ArchiveTune'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_COMMIT: 62d50236204928bbc202aa63a18069f8399e4801
      SIGNED_SHA256: fecc0e4acaa88bc5104d8991b409f683c4be2c62a1a254db9bca17bd4842050e
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: release-assets
      - name: Retrieve verified Android build
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14785745317/zip" > unsigned.zip
          echo 'bc86dcc23249c452b4b42caae796340ac75a6f14ec9ff876c15c559db2ab883f  unsigned.zip' | sha256sum -c -
      - name: Reassemble and verify signed APK
        run: python release-assets/assemble.py
      - name: Publish verified release
        run: |
          set -euo pipefail
          tag=v18.0.6
          apk=app-gms-mobile-arm64-release.apk
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" "$apk" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_COMMIT" --title 'Music 18.0.6' --notes-file release-assets/release-notes.md --draft
          fi
          existing=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,targetCommitish)
          test "$(jq -r .targetCommitish <<< "$existing")" = "$SOURCE_COMMIT"
          test "$(jq -r .isPrerelease <<< "$existing")" = false
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$apk" --output downloaded.apk
          echo "$SIGNED_SHA256  downloaded.apk" | sha256sum -c -
          if [[ $(jq -r .isDraft <<< "$existing") == true ]]; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          fi
